# TK-023. The same commands as on a developer's machine, with the same pinned tools
# (Tools/Lint/install.sh) and the same configuration (.swiftformat, .swiftlint.yml).
# Not yet run on a GitHub runner: the Xcode path below is a guess to be confirmed.
name: lint

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      # Swift 6.4 / SwiftSyntax 604 are pinned in Tools/Lint/Package.swift: the toolchain of Xcode 27.
      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode_27.0.app/Contents/Developer

      - uses: actions/cache@v4
        with:
          path: |
            Tools/Lint/.tools
            Tools/Lint/.build
          key: lint-${{ hashFiles('Tools/Lint/install.sh', 'Tools/Lint/Package.swift') }}

      - name: Tests of the checker
        run: swift test --package-path Tools/Lint -j 2

      - name: The tools agree with each other
        run: Tools/Lint/selftest.sh

      - name: Lint (changes nothing)
        run: Tools/Lint/lint.sh
